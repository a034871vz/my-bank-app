server:
  port: 0

spring:
  application:
    name: accounts-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:5432/bankdb?currentSchema=accounts
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: accounts
  liquibase:
    enabled: true
    change-log: classpath:db/changelog-master.yaml
    default-schema: accounts
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      discovery:
        enabled: true
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${random.value}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8082}/realms/bank-realm
      client:
        registration:
          accounts-service:
            provider: keycloak
            client-id: accounts-service
            client-secret: ${ACCOUNTS_SERVICE_SECRET:default-secret}
            authorization-grant-type: client_credentials
            scope: notifications
        provider:
          keycloak:
            issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8082}/realms/bank-realm

management:
  endpoints:
    web:
      exposure:
        include: health,info