server:
  port: 8080

spring:
  application:
    name: gateway-api
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      discovery:
        enabled: true
        register: false
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: accounts-service
          uri: lb://accounts-service
          predicates:
            - Path=/accounts/**
          filters:
            - StripPrefix=0

        - id: cash-service
          uri: lb://cash-service
          predicates:
            - Path=/cash/**
          filters:
            - StripPrefix=0

        - id: transfer-service
          uri: lb://transfer-service
          predicates:
            - Path=/transfer/**
          filters:
            - StripPrefix=0

        - id: notifications-service
          uri: lb://notifications-service
          predicates:
            - Path=/notifications/**
          filters:
            - StripPrefix=0

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8082}/realms/bank-realm

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG