server:
  port: 8080

spring:
  application:
    name: gateway-api
  cloud:
    consul:
      host: consul
      port: 8500
      discovery:
        enabled: true
        prefer-ip-address: true
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: accounts-service
          uri: lb://accounts-service
          predicates:
            - Path=/accounts/**
          filters:
            - TokenRelay
        - id: cash-service
          uri: lb://cash-service
          predicates:
            - Path=/cash/**
          filters:
            - TokenRelay
        - id: transfer-service
          uri: lb://transfer-service
          predicates:
            - Path=/transfer/**
          filters:
            - TokenRelay
        - id: notifications-service
          uri: lb://notifications-service
          predicates:
            - Path=/notifications/**
          filters:
            - TokenRelay
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/bank-realm

management:
  endpoints:
    web:
      exposure:
        include: health,info