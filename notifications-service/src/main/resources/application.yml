server:
  port: 0

spring:
  application:
    name: notifications-service
  cloud:
    consul:
      host: ${CONSUL_HOST:localhost}
      port: 8500
      discovery:
        enabled: true
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${random.value}
        heartbeat:
          enabled: true
        health-check-enabled: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:8082}/realms/bank-realm

management:
  endpoints:
    web:
      exposure:
        include: health,info